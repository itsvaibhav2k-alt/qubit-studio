name: Verification

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      negative_controls:
        description: 'Also verify the browser harness detects intentional accessibility regressions'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: verification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Install the locked Playwright Chromium browser and Linux dependencies
        run: ./node_modules/.bin/playwright install --with-deps chromium
      - name: Frontend tests, lint, one production build, typecheck, and browser journeys
        run: npm run check
      - name: Browser harness negative controls
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.negative_controls }}
        run: npm run test:browser:negative
      - name: Preserve verification evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frontend-verification
          path: test-results/
          if-no-files-found: error
          retention-days: 7

  simulation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: simulation/requirements.txt
      - name: Install locked simulation dependencies
        run: python -m pip install -r simulation/requirements.txt
      - name: Simulation tests (nonempty, no skips)
        run: python qa/run-python.py
      - name: Preserve simulation evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: simulation-verification
          path: test-results/python/
          if-no-files-found: error
          retention-days: 7
